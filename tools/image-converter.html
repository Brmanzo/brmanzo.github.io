<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Image Converter | Bradley R Manzo</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../styles.css">
	<style>
		.converter-container {
			max-width: 600px;
			margin: 2rem auto;
			padding: 2rem;
			background: var(--surface);
			border-radius: 12px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1);
			text-align: center;
		}
		.file-input-wrapper {
			margin: 2rem 0;
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 1rem;
			flex-wrap: wrap;
		}
		#preview-image {
			max-width: 100%;
			max-height: 400px;
			margin: 1rem 0;
			border-radius: 8px;
			display: none;
		}
		.controls {
			display: none;
			margin-top: 1rem;
			gap: 1rem;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
		}
		select {
			padding: 0.75rem;
			border-radius: 6px;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text);
			font-family: 'Inter', sans-serif;
		}
	</style>
</head>
<body>
	<!-- ======= HEADER ======= -->
	<custom-header></custom-header>
	<!-- ======= MAIN CONTENT ======= -->
	<main>
		<section class="container">
			<h1>Image Format Converter</h1>
			<p style="text-align: center; color: var(--text-muted);">Convert images between PNG, JPG, and WEBP formats securely in your browser. Files are never uploaded to a server.</p>

			<div class="converter-container">
				<div class="file-input-wrapper">
					<!-- Hide the ugly default file input -->
					<input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" style="display: none;">
					
					<!-- Use a label tied to the input for our styled button -->
					<label for="file-input" class="btn" style="background: var(--light); color: var(--text); cursor: pointer; margin-top: 0;">
						<span id="file-name-display">Upload Image...</span>
					</label>

					<!-- Style the select dropdown using the exact same classes -->
					<select id="format-select" class="btn" style="margin-top: 0; cursor: pointer; border-right: 0.5rem solid transparent; outline: none;">
						<option value="image/jpeg">Convert to JPG</option>
						<option value="image/png">Convert to PNG</option>
						<option value="image/webp">Convert to WEBP</option>
					</select>
				</div>
				<div id="detected-format" style="margin-bottom: 1rem; font-weight: 600; color: var(--accent); display: none;"></div>

				<img id="preview-image" alt="Image preview">

				<div class="controls" id="controls">
					<button id="download-btn" class="btn">Download Converted Image</button>
				</div>
			</div>
		</section>
	</main>
	<custom-contact></custom-contact>
	<custom-footer></custom-footer>
	<script src="../components.js"></script>

	<script>
		const fileInput = document.getElementById('file-input');
		const fileNameDisplay = document.getElementById('file-name-display');
		const previewImage = document.getElementById('preview-image');
		const controls = document.getElementById('controls');
		const formatSelect = document.getElementById('format-select');
		const downloadBtn = document.getElementById('download-btn');
		const detectedFormatText = document.getElementById('detected-format');

		let currentImageFile = null;

		fileInput.addEventListener('change', (e) => {
			const file = e.target.files[0];
			if (!file) return;

			currentImageFile = file;
			fileNameDisplay.textContent = file.name;
			
			// Auto-detect format and display
			const extension = file.type.split('/')[1].toUpperCase();
			detectedFormatText.textContent = `Auto-Detected Input: ${extension}`;
			detectedFormatText.style.display = 'block';

			// Auto-select a different format than the input
			if (file.type === 'image/jpeg') formatSelect.value = 'image/png';
			else if (file.type === 'image/png') formatSelect.value = 'image/jpeg';
			else if (file.type === 'image/webp') formatSelect.value = 'image/png';
			
			const reader = new FileReader();
			reader.onload = (event) => {
				previewImage.src = event.target.result;
				previewImage.style.display = 'block';
				controls.style.display = 'flex';
			};
			reader.readAsDataURL(file);
		});

		downloadBtn.addEventListener('click', () => {
			if (!currentImageFile || !previewImage.src) return;

			const targetFormat = formatSelect.value;
			const extension = targetFormat.split('/')[1] === 'jpeg' ? 'jpg' : targetFormat.split('/')[1];
			
			// Create a canvas to do the conversion
			const canvas = document.createElement('canvas');
			canvas.width = previewImage.naturalWidth;
			canvas.height = previewImage.naturalHeight;
			
			const ctx = canvas.getContext('2d');
			
			// If converting to JPG, fill with white background first (since JPG doesn't support transparency)
			if (targetFormat === 'image/jpeg') {
				ctx.fillStyle = '#FFFFFF';
				ctx.fillRect(0, 0, canvas.width, canvas.height);
			}
			
			ctx.drawImage(previewImage, 0, 0);

			// Convert canvas to data URL in the target format
			const dataUrl = canvas.toDataURL(targetFormat, 0.9);

			// Create a temporary link to download
			const a = document.createElement('a');
			a.href = dataUrl;
			const originalName = currentImageFile.name.split('.')[0];
			a.download = `${originalName}-converted.${extension}`;
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
		});
	</script>
</body>
</html>
